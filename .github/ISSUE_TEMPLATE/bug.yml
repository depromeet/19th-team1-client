name: 버그
description: 의도와 다르게 동작하는 것
labels: [fix]
body:
  - type: textarea
    id: problem
    attributes:
      label: 현상
      description: 무엇이 어떻게 잘못됐는지
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
  - type: dropdown
    id: platform
    attributes:
      label: 환경
      options:
        - 웹
        - 앱 (iOS)
        - 앱 (Android)
        - 여러 곳
  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷
