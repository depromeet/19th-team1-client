name: PR 제목

# Squash 병합 커밋 제목이 PR 제목이 된다 — 커밋 훅이 보지 못하는 PR 제목을 여기서 검사한다
# 제목만 고쳐도 다시 돌도록 edited 를 받는다. 코드 검사(ci.yml)와 워크플로를 나눈 이유:
# 같이 두면 제목 수정 실행이 진행 중인 코드 검사를 취소하거나, 건너뛴 검사가 통과로 잡힐 수 있다
on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 배포 PR 은 release: 로 구분한다 (포함된 PR 들은 이미 dev 에서 커밋 규칙을 통과했다)
      - name: main 대상은 release 형식
        if: github.base_ref == 'main'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$TITLE" in
            "release: "?*) exit 0 ;;
          esac
          echo "⛔ main 대상 PR 제목은 'release: <배포 내용>' 형식이어야 합니다: $TITLE"
          exit 1

      - if: github.base_ref == 'dev'
        uses: actions/checkout@v4

      - if: github.base_ref == 'dev'
        uses: pnpm/action-setup@v4

      - if: github.base_ref == 'dev'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: github.base_ref == 'dev'
        run: pnpm install --frozen-lockfile

      # 커밋 훅과 같은 commitlint 설정으로 검사한다
      - name: dev 대상은 커밋 규칙
        if: github.base_ref == 'dev'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | pnpm exec commitlint || {
            echo "⛔ PR 제목이 커밋 규칙과 다릅니다. 예) feat: 로그인 페이지 추가"
            exit 1
          }
