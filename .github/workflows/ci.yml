name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# CI 는 코드를 읽기만 한다 — 레포 기본 토큰 권한과 상관없이 쓰기·PR 승인 권한을 갖지 않게
permissions:
  contents: read

# 외부 액션은 태그가 아니라 커밋 SHA 로 고정한다 — 태그는 옮겨질 수 있어서, 액션 저장소가 탈취되면
# 같은 태그로 다른 코드가 돈다. 올릴 때는 SHA 와 뒤의 버전 주석을 함께 바꾼다.

# 같은 PR 에 새 커밋이 오면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 규칙 — 로컬 훅은 --no-verify 로 건너뛸 수 있어서 서버에서 한 번 더 본다
  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 브랜치 이름은 PR 작성자가 정하는 값이라 run 에 직접 넣지 않고 env 로 넘긴다 (셸 주입 방지)
      - name: 브랜치 이름
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: sh scripts/check-branch-name.sh "$HEAD_REF"

      # 기본 브랜치가 main 이라 새 PR 의 대상이 main 으로 잡히기 쉽다 — 기능 PR 은 dev 로
      - name: main 대상 PR 은 dev 에서만
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "⛔ main 으로는 dev 에서만 PR 을 올립니다. 이 PR 의 대상 브랜치를 dev 로 바꿔 주세요."
          exit 1

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # package.json 의 packageManager(pnpm@10.x)를 읽는다
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 포맷
        run: pnpm format:check

      - name: 린트
        run: pnpm lint

      - name: 타입 검사
        run: pnpm typecheck

      - name: 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

  # 실제 브라우저로 화면 흐름을 본다 — 브라우저 설치로 시간이 더 들어서 필수 검사로는 걸지 않는다
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 브라우저 설치
        run: pnpm --filter @team1/web exec playwright install --with-deps chromium webkit

      - name: 웹 빌드
        run: pnpm --filter @team1/web build

      - name: E2E
        run: pnpm test:e2e

      - name: 실패 결과 올리기
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
