packages:
  - apps/*
  - packages/*

# 여러 워크스페이스가 같이 쓰는 버전은 여기서 한 번만 정한다 (각 package.json 에서는 "catalog:").
# React 는 앱(Expo)과 웹(Next)이 반드시 같은 버전이어야 한다.
# 한 레포에 React 가 두 벌 깔리면 앱이 런타임 에러로 죽는다 — https://docs.expo.dev/guides/monorepos/
# React 를 올릴 때는 Expo SDK 가 요구하는 버전(`npx expo install --check`)에 맞춘다.
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ~19.3.0
  '@types/react-dom': ~19.3.0
  typescript: ~6.0.3
  eslint: ^9.39.5

# 공급망 보호 — 최근 npm 공급망 사고는 악성 버전이 몇 시간 노출된 뒤 내려갔다.
# 공개된 지 7일이 안 된 버전은 설치하지 않는다(딸려 오는 패키지 포함). 단위는 분.
# 급한 보안 패치가 필요하면 minimumReleaseAgeExclude 에 그 패키지만 적는다.
minimumReleaseAge: 10080
# 이전에 받은 것보다 신뢰 수준(서명·출처 증명)이 낮아진 판은 받지 않는다
trustPolicy: no-downgrade
# 딸려 오는 패키지가 레지스트리가 아닌 곳(git·URL)에서 오면 막는다
blockExoticSubdeps: true
