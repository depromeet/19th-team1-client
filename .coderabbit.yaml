# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# AI 리뷰 설정 — 시범 운영 중 (docs/code-review.md)
language: ko-KR
reviews:
  # 조용하게 시작한다. 시범 결과를 보고 assertive 검토
  profile: chill
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # 기본 브랜치가 main 으로 돌아가도 dev 대상 PR 을 리뷰하게
    base_branches: ['dev']
  path_filters:
    - '!pnpm-lock.yaml'
    - '!**/next-env.d.ts'
  path_instructions:
    - path: '.github/workflows/**'
      instructions: 'run: 에 github.head_ref, PR 제목·본문 같은 PR 작성자 입력 표현식을 직접 넣었는지 확인한다. env 로 넘기고 셸 변수로 참조해야 한다.'
    - path: 'apps/web/**'
      instructions: "Next 16 cacheComponents 를 켜 두었다. 'use cache' 와 요청마다 달라지는 데이터 접근(cookies, headers, 캐시하지 않은 fetch)이 Suspense 경계 안에 있는지 확인한다."
